[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secpd"
version = "0.1.0"
description = "PD-/Misconduct-Scoring aus SEC-Filings: Finanzkennzahlen + LLM-Text-Features"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3.3",
    "pandas>=2.3.3,<3",
    "scikit-learn>=1.7.2",
    "joblib>=1.4",
    "pydantic>=2.12",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
